      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Image illisible: " + src));
          img.src = src;
        });
      }

      // --- audio (musique) ---
      let audioCtx = null;
      function getAudioCtx() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 44100,
          });
        }
        return audioCtx;
      }

      // découpe un passage aléatoire de `clipSec` dans le buffer décodé (l'extrait
      // iTunes fait ~30s, on n'en garde qu'une fenêtre pour ne pas dépasser la
      // durée réglée par l'utilisateur)
      // découpe un passage aléatoire : `clipSec` d'écoute + `fadeSec` de fondu
      // supplémentaire qui continuera de jouer (en s'atténuant) pendant l'écran
      // réponse, plutôt qu'une coupure nette
      function trimAudioBufferWithFade(ctx, buffer, clipSec, fadeSec) {
        const sr = buffer.sampleRate;
        const totalFrames = buffer.length;
        const targetFrames = Math.round((clipSec + fadeSec) * sr);
        const clipFrames = Math.min(totalFrames, targetFrames);
        const fadeFrames = Math.min(clipFrames, Math.round(fadeSec * sr));
        const fadeStart = clipFrames - fadeFrames;
        const maxStart = Math.max(0, totalFrames - clipFrames);
        const startFrame = Math.floor(Math.random() * (maxStart + 1));

        // toujours créé à la durée cible exacte : si l'extrait source est plus
        // court que demandé, le reste est complété de silence (déjà à 0 par
        // défaut) plutôt que de raccourcir la piste et désynchroniser la vidéo
        const trimmed = ctx.createBuffer(
          buffer.numberOfChannels,
          targetFrames,
          sr,
        );
        for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
          const srcData = buffer
            .getChannelData(ch)
            .subarray(startFrame, startFrame + clipFrames);
          const dst = trimmed.getChannelData(ch);
          dst.set(srcData);
          for (let f = 0; f < fadeFrames; f++) {
            dst[fadeStart + f] *= 1 - f / fadeFrames;
          }
        }
        return trimmed;
      }

      async function loadAndTrimAudio(url, clipSec, fadeSec) {
        const ctx = getAudioCtx();
        const res = await fetch(url);
        if (!res.ok) throw new Error("Extrait audio illisible: " + url);
        const arrayBuffer = await res.arrayBuffer();
        const decoded = await ctx.decodeAudioData(arrayBuffer);
        return trimAudioBufferWithFade(ctx, decoded, clipSec, fadeSec);
      }

      // silence de la durée voulue, même format que les extraits musicaux —
      // sert à combler la piste audio pendant les segments non musicaux
      function silentBuffer(durMs) {
        const ctx = getAudioCtx();
        const frames = Math.max(1, Math.round((durMs / 1000) * ctx.sampleRate));
        return ctx.createBuffer(2, frames, ctx.sampleRate);
      }

      // --- pistes audio fournies (public/), insérées aux moments clés de la
      // vidéo pour les catégories non musicales : un son sur le splash, un
      // sur la phase de devinette (la réponse reste silencieuse) ---
      const CUE_URLS = {
        splash: "/video_splash_screen.mp3",
        guessing: "/video_guessing.mp3",
      };
      const cueBufferCache = new Map();
      // chargée/décodée une seule fois par clé puis mise en cache ; renvoie
      // null si le fichier est absent (le segment restera alors silencieux
      // plutôt que de faire échouer toute la génération)
      function loadCueBuffer(key) {
        if (!cueBufferCache.has(key)) {
          cueBufferCache.set(
            key,
            (async () => {
              try {
                const res = await fetch(CUE_URLS[key]);
                if (!res.ok) return null;
                const arrayBuffer = await res.arrayBuffer();
                return await getAudioCtx().decodeAudioData(arrayBuffer);
              } catch (e) {
                console.warn(`Piste audio "${key}" indisponible :`, e.message);
                return null;
              }
            })(),
          );
        }
        return cueBufferCache.get(key);
      }

      // construit un buffer de exactement `durSec`, en rejouant `source`
      // depuis son tout début (jamais un point aléatoire) et en la bouclant
      // si elle est plus courte que la durée demandée ; léger fondu à chaque
      // raccord de boucle pour éviter un clic
      function loopBufferToDuration(source, durSec, fadeSec = 0.03) {
        if (!source) return null;
        const sr = source.sampleRate;
        const targetFrames = Math.max(1, Math.round(durSec * sr));
        const srcFrames = source.length;
        const fadeFrames = Math.min(
          Math.floor(srcFrames / 2),
          Math.round(fadeSec * sr),
        );
        const out = getAudioCtx().createBuffer(
          source.numberOfChannels,
          targetFrames,
          sr,
        );
        for (let ch = 0; ch < source.numberOfChannels; ch++) {
          const src = source.getChannelData(ch);
          const dst = out.getChannelData(ch);
          for (let i = 0; i < targetFrames; i++) dst[i] = src[i % srcFrames];
          if (srcFrames < targetFrames) {
            for (
              let loopEnd = srcFrames;
              loopEnd < targetFrames;
              loopEnd += srcFrames
            ) {
              for (
                let f = 0;
                f < fadeFrames &&
                loopEnd - f - 1 >= 0 &&
                loopEnd + f < targetFrames;
                f++
              ) {
                const g = f / fadeFrames;
                dst[loopEnd - 1 - f] *= g;
                dst[loopEnd + f] *= g;
              }
            }
          }
        }
        return out;
      }

      // baisse le volume de la piste "devinette" (pour ne pas couvrir la
      // réflexion) et ajoute un fondu de sortie sur les 2 dernières secondes
      // plutôt qu'une coupure nette avant la réponse
      function applyGuessingVolumeAndFadeOut(
        buffer,
        volume = 0.2,
        fadeOutSec = 2,
      ) {
        if (!buffer) return null;
        const sr = buffer.sampleRate;
        const totalFrames = buffer.length;
        const fadeFrames = Math.min(totalFrames, Math.round(fadeOutSec * sr));
        const fadeStart = totalFrames - fadeFrames;
        for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
          const d = buffer.getChannelData(ch);
          for (let i = 0; i < totalFrames; i++) {
            let g = volume;
            if (i >= fadeStart) g *= 1 - (i - fadeStart) / fadeFrames;
            d[i] *= g;
          }
        }
        return buffer;
      }

      async function preloadAll(picked) {
        const totalTasks = picked.reduce(
          (sum, m) =>
            sum +
            (m.mediaType === "music"
              ? 2
              : m.mediaType === "flag"
                ? 1
                : m.imageUrls.length + 1),
          0,
        );
        const results = new Array(picked.length);
        let done = 0;

        function bump() {
          done++;
          setStatus(`Préchargement ${done}/${totalTasks}…`);
          setProgress((done / totalTasks) * 100);
        }

        let idx = 0;
        async function worker() {
          while (idx < picked.length) {
            const my = idx++;
            const m = picked[my];
            try {
              if (m.mediaType === "music") {
                const [audioBuffer, posterImg] = await Promise.all([
                  loadAndTrimAudio(
                    m.previewUrl,
                    currentMusicClipSec(),
                    currentRevealSec(),
                  ).then((buf) => {
                    bump();
                    return buf;
                  }),
                  loadImage(m.posterUrl).then((img) => {
                    bump();
                    return img;
                  }),
                ]);
                results[my] = {
                  title: m.title,
                  mediaType: "music",
                  artist: m.artist,
                  track: m.track,
                  audioBuffer,
                  posterImg,
                };
                continue;
              }
              if (m.mediaType === "flag") {
                const posterImg = await loadImage(m.posterUrl).then((img) => {
                  bump();
                  return img;
                });
                results[my] = {
                  title: m.title,
                  mediaType: "flag",
                  capital: m.capital,
                  posterImg,
                };
                continue;
              }
              const [backdropImgs, posterImg] = await Promise.all([
                Promise.all(
                  m.imageUrls.map((url) =>
                    loadImage(url).then((img) => {
                      bump();
                      return img;
                    }),
                  ),
                ),
                loadImage(m.posterUrl).then((img) => {
                  bump();
                  return img;
                }),
              ]);
              results[my] = {
                title: m.title,
                mediaType: m.mediaType,
                backdropImgs,
                posterImg,
              };
            } catch (e) {
              // une image qui ne charge pas (ex: pare-feu Cloudflare sur les
              // peintures selon le Referer du navigateur) ne doit pas faire
              // planter tout le quiz — on exclut juste cet item, comme le
              // fait déjà le serveur quand une image est introuvable
              console.warn(
                `Image illisible pour "${m.title}", exclu du quiz :`,
                e.message,
              );
              results[my] = null;
            }
          }
        }

        await Promise.all(
          Array.from({ length: CFG.preloadConcurrency }, worker),
        );
        return results.filter(Boolean);
      }

      // le timeline démarre par un écran splash, puis enchaîne les films
      function buildTimeline(imageMs, revealMs, splashMs, musicClipMs, flagMs) {
        const tl = [];
        let t = 0;
        if (splashMs > 0) {
          tl.push({ type: "splash", start: t, dur: splashMs });
          t += splashMs;
        }
        items.forEach((m, i) => {
          if (m.mediaType === "music") {
            tl.push({
              type: "music-guess",
              itemIdx: i,
              start: t,
              dur: musicClipMs,
            });
            t += musicClipMs;
            tl.push({
              type: "music-reveal",
              itemIdx: i,
              start: t,
              dur: revealMs,
            });
            t += revealMs;
            return;
          }
          if (m.mediaType === "flag") {
            tl.push({
              type: "flag-guess",
              itemIdx: i,
              start: t,
              dur: flagMs,
            });
            t += flagMs;
            tl.push({
              type: "flag-reveal",
              itemIdx: i,
              start: t,
              dur: revealMs,
            });
            t += revealMs;
            return;
          }
          const itemGuessStart = t;
          const itemGuessDur = m.backdropImgs.length * imageMs;
          m.backdropImgs.forEach((_, imgIdx) => {
            tl.push({
              type: "guess",
              itemIdx: i,
              imgIdx,
              start: t,
              dur: imageMs,
              itemGuessStart,
              itemGuessDur,
            });
            t += imageMs;
          });
          tl.push({ type: "reveal", itemIdx: i, start: t, dur: revealMs });
          t += revealMs;
        });
        return { timeline: tl, total: t };
      }

      function resetStage() {
        stage.innerHTML = "";
        const ph = document.createElement("div");
        ph.className = "stage-placeholder";
        ph.id = "stagePlaceholder";
        ph.textContent =
          "Configure tes réglages puis clique sur « Générer le quizz »";
        stage.appendChild(ph);
      }
      function setStagePlaceholder(text) {
        const ph = document.getElementById("stagePlaceholder");
        if (ph) ph.textContent = text;
      }

      function drawCover(img, x, y, w, h) {
        const ir = img.width / img.height,
          cr = w / h;
        let sw, sh, sx, sy;
        if (ir > cr) {
          sh = img.height;
          sw = sh * cr;
          sy = 0;
          sx = (img.width - sw) / 2;
        } else {
          sw = img.width;
          sh = sw / cr;
          sx = 0;
          sy = (img.height - sh) / 2;
        }
        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      }

      // dessine l'image ENTIÈRE sans rien recadrer (contain-fit) — le fond
      // est comblé par une version recadrée + assombrie de la même image,
      // pour éviter des bandes noires nues (surtout utile pour les portraits
      // d'acteurs qui se faisaient couper en haut/bas avec un simple cover-fit)
      function drawContain(img, x, y, w, h) {
        drawCover(img, x, y, w, h);
        ctx.fillStyle = "rgba(10,10,11,0.55)";
        ctx.fillRect(x, y, w, h);

        const ir = img.width / img.height,
          cr = w / h;
        let dw, dh, dx, dy;
        if (ir > cr) {
          dw = w;
          dh = w / ir;
          dx = x;
          dy = y + (h - dh) / 2;
        } else {
          dh = h;
          dw = h * ir;
          dy = y;
          dx = x + (w - dw) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
      }
      // --- habillage "jeu" partagé par tous les écrans vidéo (hors splash,
      // qui a le sien) : reprend la palette et les codes visuels de la page
      // web (pilules translucides, dégradé cyan->violet, halo, confettis) ---

      function roundedRectPath(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      // fond dégradé sombre + confettis, pour les écrans où l'arrière-plan
      // est visible (réponse, musique) — le splash a sa propre variante animée
      function drawGameBackdrop() {
        const bg = ctx.createRadialGradient(
          canvas.width / 2,
          canvas.height * 0.4,
          60,
          canvas.width / 2,
          canvas.height * 0.4,
          canvas.width * 0.75,
        );
        bg.addColorStop(0, "#201c30");
        bg.addColorStop(1, "#0a0a10");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawGameParticles(elapsedMs) {
        for (const p of GAME_PARTICLES) drawGameParticle(p, elapsedMs);
      }

      // halo lumineux pulsant (cyan -> violet), pour mettre en valeur un
      // élément central (poster, pochette…) comme sur le splash
      function drawGlowBurst(cx, cy, elapsedMs, baseR = 260) {
        const pulse = 0.8 + 0.2 * Math.sin(elapsedMs / 900);
        const r = baseR * pulse;
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        glow.addColorStop(0, "rgba(79,209,232,0.3)");
        glow.addColorStop(0.55, "rgba(157,92,230,0.16)");
        glow.addColorStop(1, "rgba(157,92,230,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // pilule translucide façon UI web (chip / badge de version) — sert de
      // compteur "N° x/y" ou toute étiquette courte
      function drawBadge(text, x, y, opts = {}) {
        const {
          align = "left",
          font = "700 24px ui-monospace, Menlo, monospace",
          fg = "#ede8de",
          border = "rgba(157,92,230,0.6)",
          bg = "rgba(18,16,28,0.72)",
          paddingX = 20,
          paddingY = 11,
        } = opts;
        ctx.save();
        ctx.font = font;
        const textW = ctx.measureText(text).width;
        const w = textW + paddingX * 2;
        const h = paddingY * 2 + 22;
        const bx =
          align === "right" ? x - w : align === "center" ? x - w / 2 : x;
        const by = y - h / 2;
        roundedRectPath(bx, by, w, h, h / 2);
        ctx.fillStyle = bg;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = border;
        ctx.stroke();
        ctx.fillStyle = fg;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
        ctx.restore();
      }

      // bannière "RÉPONSE" façon jeu télévisé (pilule dégradée + halo)
      function drawRevealBanner(centerX, y) {
        ctx.save();
        ctx.font = "800 26px ui-monospace, Menlo, monospace";
        const text = "RÉPONSE";
        const textW = ctx.measureText(text).width;
        const w = textW + 74;
        const h = 48;
        roundedRectPath(centerX - w / 2, y - h / 2, w, h, h / 2);
        const grad = ctx.createLinearGradient(
          centerX - w / 2,
          0,
          centerX + w / 2,
          0,
        );
        grad.addColorStop(0, "#4fd1e8");
        grad.addColorStop(1, "#9d5ce6");
        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(157,92,230,0.5)";
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#0a0a10";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, centerX, y + 2);
        ctx.restore();
      }

      // liseré décoratif en dégradé, dessiné en dernier sur chaque écran non-
      // splash pour rappeler la bordure lumineuse du panneau sur la page web
      function drawFrameBorder() {
        ctx.save();
        const inset = 10;
        roundedRectPath(
          inset,
          inset,
          canvas.width - inset * 2,
          canvas.height - inset * 2,
          24,
        );
        const grad = ctx.createLinearGradient(
          0,
          0,
          canvas.width,
          canvas.height,
        );
        grad.addColorStop(0, "rgba(79,209,232,0.4)");
        grad.addColorStop(0.5, "rgba(157,92,230,0.4)");
        grad.addColorStop(1, "rgba(232,163,61,0.4)");
        ctx.lineWidth = 4;
        ctx.strokeStyle = grad;
        ctx.stroke();
        ctx.restore();
      }

      // barre de progression façon jauge de jeu : piste sombre, remplissage
      // en dégradé cyan -> violet avec un léger halo, extrémités arrondies
      function drawGameProgress(frac, width, y = 46, h = 14) {
        const w = width || canvas.width;
        const pad = 24;
        const barW = w - pad * 2;
        ctx.save();
        roundedRectPath(pad, y, barW, h, h / 2);
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fill();
        const fillW = Math.max(h, barW * Math.min(1, Math.max(0, frac)));
        roundedRectPath(pad, y, fillW, h, h / 2);
        const grad = ctx.createLinearGradient(pad, 0, pad + fillW, 0);
        grad.addColorStop(0, "#4fd1e8");
        grad.addColorStop(1, "#9d5ce6");
        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(79,209,232,0.55)";
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      }

      function drawSideThumbnails(m, upToIdx, colX, colW) {
        // miniatures 3x plus grandes, centrées dans leur propre colonne,
        // coins arrondis + liseré qui alterne cyan/violet façon petites cartes
        const thumbW = 240,
          thumbH = 135,
          gap = 14,
          startY = 50,
          r = 14;
        const x = colX + (colW - thumbW) / 2;
        for (let j = 0; j < upToIdx; j++) {
          const y = startY + j * (thumbH + gap);
          if (y + thumbH > canvas.height - 40) break;
          ctx.save();
          ctx.globalAlpha = 0.9;
          roundedRectPath(x - 4, y - 4, thumbW + 8, thumbH + 8, r + 4);
          ctx.fillStyle = "#111113";
          ctx.fill();
          ctx.save();
          roundedRectPath(x, y, thumbW, thumbH, r);
          ctx.clip();
          drawCover(m.backdropImgs[j], x, y, thumbW, thumbH);
          ctx.restore();
          roundedRectPath(x, y, thumbW, thumbH, r);
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = j % 2 === 0 ? "#4fd1e8" : "#9d5ce6";
          ctx.stroke();
          ctx.restore();
        }
      }
      function contentTypeLabel() {
        const types = new Set(items.map((m) => m.mediaType));
        if (types.size === 1) {
          const labels = {
            movie: "FILMS",
            tv: "SÉRIES",
            person: "ACTEURS",
            game: "JEUX",
            country: "PAYS",
            painting: "PEINTRES",
            flag: "DRAPEAUX",
          };
          return labels[[...types][0]] || "TITRES";
        }
        return "TITRES";
      }

      function easeOutBack(t) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      // confettis décoratifs (splash ET écrans réponse/musique) : positions/
      // couleurs/phases fixées une seule fois au chargement (pas à chaque
      // frame) pour une animation stable, qui reprend les formes/couleurs du
      // logo (triangles, losanges, ronds cyan/violet/ambre)
      const GAME_PARTICLES = Array.from({ length: 18 }, (_, i) => ({
        xFrac: Math.random(),
        yFrac: Math.random(),
        size: 5 + Math.random() * 12,
        color: ["#4fd1e8", "#9d5ce6", "#e8a33d"][i % 3],
        phase: Math.random() * Math.PI * 2,
        driftPx: 14 + Math.random() * 18,
        driftMs: 1800 + Math.random() * 1600,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.0015,
        shape: i % 3 === 0 ? "triangle" : i % 3 === 1 ? "circle" : "diamond",
      }));

      function drawGameParticle(p, elapsedMs) {
        const x = p.xFrac * canvas.width;
        const y =
          p.yFrac * canvas.height +
          Math.sin(elapsedMs / p.driftMs + p.phase) * p.driftPx;
        const rot = p.rot + elapsedMs * p.rotSpeed;
        const alpha = 0.18 + 0.12 * Math.sin(elapsedMs / 900 + p.phase);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = p.color;
        const s = p.size;
        if (p.shape === "triangle") {
          ctx.beginPath();
          ctx.moveTo(0, -s);
          ctx.lineTo(s * 0.87, s * 0.5);
          ctx.lineTo(-s * 0.87, s * 0.5);
          ctx.closePath();
          ctx.fill();
        } else if (p.shape === "diamond") {
          ctx.beginPath();
          ctx.moveTo(0, -s);
          ctx.lineTo(s, 0);
          ctx.lineTo(0, s);
          ctx.lineTo(-s, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // splash animé : logo qui "rebondit" à l'entrée puis flotte doucement,
      // halo pulsant façon jeu, confettis en fond, sous-titre qui apparaît
      // une fois le logo posé — repli en texte simple si le logo n'a pas pu
      // charger
      function drawSplash(elapsedMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const bg = ctx.createRadialGradient(
          canvas.width / 2,
          canvas.height * 0.4,
          60,
          canvas.width / 2,
          canvas.height * 0.4,
          canvas.width * 0.75,
        );
        bg.addColorStop(0, "#201c30");
        bg.addColorStop(1, "#0a0a10");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const p of GAME_PARTICLES) drawGameParticle(p, elapsedMs);

        const centerX = canvas.width / 2;
        const centerY = canvas.height * 0.42;

        const glowPulse = 0.75 + 0.25 * Math.sin(elapsedMs / 700);
        const glowR = 230 * glowPulse;
        const glow = ctx.createRadialGradient(
          centerX,
          centerY,
          0,
          centerX,
          centerY,
          glowR,
        );
        glow.addColorStop(0, "rgba(79,209,232,0.35)");
        glow.addColorStop(0.55, "rgba(157,92,230,0.18)");
        glow.addColorStop(1, "rgba(157,92,230,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(centerX, centerY, glowR, 0, Math.PI * 2);
        ctx.fill();

        if (logoImg) {
          const enterT = Math.min(1, elapsedMs / 700);
          const eased = easeOutBack(enterT);
          const baseSize = 300;
          const scale = 0.3 + 0.7 * eased;
          const idleT = Math.max(0, elapsedMs - 700);
          const bobY = enterT >= 1 ? Math.sin(idleT / 450) * 7 : 0;
          const rot =
            enterT < 1 ? (1 - enterT) * -0.16 : Math.sin(idleT / 750) * 0.025;
          const alpha = Math.min(1, elapsedMs / 220);

          const ir = logoImg.width / logoImg.height;
          const h = baseSize * scale;
          const w = h * ir;

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(centerX, centerY + bobY);
          ctx.rotate(rot);
          ctx.shadowColor = "rgba(0,0,0,0.55)";
          ctx.shadowBlur = 28;
          ctx.shadowOffsetY = 10;
          ctx.drawImage(logoImg, -w / 2, -h / 2, w, h);
          ctx.restore();
        } else {
          ctx.font = "800 64px ui-monospace, Menlo, monospace";
          ctx.fillStyle = "#ede8de";
          ctx.textAlign = "center";
          ctx.fillText("GUESS IT", centerX, centerY);
        }

        const subT = Math.max(0, Math.min(1, (elapsedMs - 900) / 400));
        if (subT > 0) {
          ctx.save();
          ctx.globalAlpha = subT;
          const slideY = (1 - subT) * 16;
          ctx.font = "700 30px ui-monospace, Menlo, monospace";
          ctx.fillStyle = "#ede8de";
          ctx.textAlign = "center";
          ctx.fillText(
            `${items.length} ${contentTypeLabel()} À DEVINER`,
            centerX,
            canvas.height * 0.74 + slideY,
          );
          ctx.restore();
        }

        drawSplashCategoryChips(elapsedMs);
      }

      // pilules des catégories sélectionnées, façon chips de l'écran de
      // config — apparaissent juste après le sous-titre, réparties sur une
      // ou deux lignes centrées ; au-delà de MAX_SPLASH_CHIPS, le reste est
      // condensé en une pilule "+N"
      function drawSplashCategoryChips(elapsedMs) {
        const labels = availableCategories
          .filter((c) => selectedCategories.has(c.key))
          .map((c) => c.label);
        if (labels.length === 0) return;

        const appearT = Math.max(0, Math.min(1, (elapsedMs - 1100) / 500));
        if (appearT <= 0) return;

        const MAX_SPLASH_CHIPS = 8;
        const shown = labels.slice(0, MAX_SPLASH_CHIPS);
        const extra = labels.length - shown.length;

        const font = "700 20px ui-monospace, Menlo, monospace";
        const paddingX = 16,
          gapX = 10,
          gapY = 10,
          h = 36;
        ctx.font = font;
        const chips = shown.map((text) => ({
          text,
          w: ctx.measureText(text).width + paddingX * 2,
          extra: false,
        }));
        if (extra > 0) {
          const text = `+${extra}`;
          chips.push({
            text,
            w: ctx.measureText(text).width + paddingX * 2,
            extra: true,
          });
        }

        // répartit les pilules sur des lignes qui ne dépassent pas la
        // largeur dispo, centrées horizontalement
        const maxRowWidth = canvas.width - 160;
        const rows = [];
        let row = [],
          rowW = 0;
        for (const chip of chips) {
          const addW = chip.w + (row.length ? gapX : 0);
          if (row.length && rowW + addW > maxRowWidth) {
            rows.push(row);
            row = [];
            rowW = 0;
          }
          row.push(chip);
          rowW += chip.w + (row.length > 1 ? gapX : 0);
        }
        if (row.length) rows.push(row);

        const startY = canvas.height * 0.85 + (1 - appearT) * 12;
        ctx.save();
        ctx.globalAlpha = appearT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        rows.forEach((r, ri) => {
          const rowWidth = r.reduce(
            (s, c, i) => s + c.w + (i > 0 ? gapX : 0),
            0,
          );
          let x = canvas.width / 2 - rowWidth / 2;
          const y = startY + ri * (h + gapY);
          for (const chip of r) {
            roundedRectPath(x, y - h / 2, chip.w, h, h / 2);
            ctx.fillStyle = chip.extra
              ? "rgba(157,92,230,0.2)"
              : "rgba(79,209,232,0.14)";
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = chip.extra
              ? "rgba(157,92,230,0.6)"
              : "rgba(79,209,232,0.55)";
            ctx.stroke();
            ctx.font = font;
            ctx.fillStyle = "#ede8de";
            ctx.fillText(chip.text, x + chip.w / 2, y + 1);
            x += chip.w + gapX;
          }
        });
        ctx.restore();
      }
      // dessine un poster/pochette avec coins arrondis + ombre portée
      // correcte (l'ombre est dessinée séparément, avant le clip, sinon le
      // clip aux coins arrondis coupe aussi l'ombre) + liseré violet
      function drawFramedImage(img, dx, dy, dw, dh, radius = 18) {
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 30;
        ctx.fillStyle = "#000";
        roundedRectPath(dx, dy, dw, dh, radius);
        ctx.fill();
        ctx.restore();

        ctx.save();
        roundedRectPath(dx, dy, dw, dh, radius);
        ctx.clip();
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();

        ctx.save();
        roundedRectPath(dx, dy, dw, dh, radius);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(157,92,230,0.6)";
        ctx.stroke();
        ctx.restore();
      }

      // petit visualiseur "égaliseur" pour l'écran musique, purement
      // décoratif (basé sur des sinusoïdes déphasées par barre, pas une
      // vraie analyse audio) mais donne un vrai feeling "jeu musical"
      function drawEqualizer(centerX, centerY, elapsedMs, barCount = 9) {
        const barW = 20,
          gap = 12,
          maxH = 130;
        const totalW = barCount * barW + (barCount - 1) * gap;
        const startX = centerX - totalW / 2;
        const colors = ["#4fd1e8", "#9d5ce6", "#e8a33d"];
        for (let i = 0; i < barCount; i++) {
          const freq = 240 + i * 53;
          const phase = i * 1.7;
          const t = (Math.sin(elapsedMs / freq + phase) + 1) / 2;
          const h = 16 + t * maxH;
          const x = startX + i * (barW + gap);
          const y = centerY - h / 2;
          roundedRectPath(x, y, barW, h, barW / 2);
          ctx.fillStyle = colors[i % colors.length];
          ctx.fill();
        }
      }

      function drawGuess(m, seg, withinMs) {
        const itemIdx = seg.itemIdx,
          imgIdx = seg.imgIdx;
        const hasSideStrip = m.backdropImgs.length > 1;
        const colW = hasSideStrip ? 280 : 0;
        const mainW = canvas.width - colW;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#151220";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // un peu de marge autour de l'image pour qu'elle reste bien à
        // l'intérieur du liseré décoratif plutôt que de le toucher
        const pad = 22;
        const imgX = pad,
          imgY = pad,
          imgW = mainW - pad * 2,
          imgH = canvas.height - pad * 2,
          radius = 16;

        ctx.save();
        roundedRectPath(imgX, imgY, imgW, imgH, radius);
        ctx.clip();
        drawContain(m.backdropImgs[imgIdx], imgX, imgY, imgW, imgH);

        const g = ctx.createLinearGradient(
          0,
          imgY + imgH * 0.62,
          0,
          imgY + imgH,
        );
        g.addColorStop(0, "rgba(10,10,16,0)");
        g.addColorStop(1, "rgba(10,10,16,0.88)");
        ctx.fillStyle = g;
        ctx.fillRect(imgX, imgY + imgH * 0.62, imgW, imgH * 0.38);
        ctx.restore();

        ctx.save();
        roundedRectPath(imgX, imgY, imgW, imgH, radius);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "rgba(157,92,230,0.5)";
        ctx.stroke();
        ctx.restore();

        const itemElapsed = seg.start - seg.itemGuessStart + withinMs;
        drawGameProgress(itemElapsed / seg.itemGuessDur, mainW);
        if (hasSideStrip) drawSideThumbnails(m, imgIdx, mainW, colW);

        drawBadge(
          `N° ${itemIdx + 1} / ${items.length}`,
          50,
          canvas.height - 58,
        );
        drawFrameBorder();
      }
      function drawReveal(m, itemIdx, withinMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameBackdrop();
        drawGameParticles(withinMs);

        const posterH = canvas.height - 220;
        const posterW = posterH * (2 / 3);
        const px = (canvas.width - posterW) / 2;
        const py = 90;

        drawGlowBurst(canvas.width / 2, py + posterH / 2, withinMs, 300);

        if (m.posterImg) {
          const ir = m.posterImg.width / m.posterImg.height;
          const boxRatio = posterW / posterH;
          let dw, dh;
          if (ir > boxRatio) {
            dw = posterW;
            dh = posterW / ir;
          } else {
            dh = posterH;
            dw = posterH * ir;
          }
          const dx = px + (posterW - dw) / 2;
          const dy = py + (posterH - dh) / 2;
          drawFramedImage(m.posterImg, dx, dy, dw, dh);
        }

        drawRevealBanner(canvas.width / 2, 62);

        ctx.save();
        ctx.font = "700 34px ui-monospace, Menlo, monospace";
        ctx.fillStyle = "#ede8de";
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 10;
        ctx.fillText(m.title, canvas.width / 2, canvas.height - 55);
        ctx.restore();

        drawBadge(
          `N° ${itemIdx + 1} / ${items.length}`,
          50,
          canvas.height - 58,
        );
        drawFrameBorder();
      }
      function drawMusicGuess(seg, withinMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameBackdrop();
        drawGameParticles(withinMs);

        drawEqualizer(canvas.width / 2, canvas.height / 2 + 20, withinMs);

        drawGameProgress(withinMs / seg.dur, canvas.width);

        drawBadge(
          `N° ${seg.itemIdx + 1} / ${items.length}`,
          50,
          canvas.height - 58,
        );
        drawFrameBorder();
      }

      function drawMusicReveal(m, itemIdx, withinMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameBackdrop();
        drawGameParticles(withinMs);

        // pochette carrée, contain-fit dans une boîte carrée (même logique
        // que le poster des autres types, juste un ratio 1:1 au lieu de 2:3)
        const boxSize = canvas.height - 260;
        const bx = (canvas.width - boxSize) / 2;
        const by = 80;

        drawGlowBurst(canvas.width / 2, by + boxSize / 2, withinMs, 300);

        if (m.posterImg) {
          const ir = m.posterImg.width / m.posterImg.height;
          let dw, dh;
          if (ir > 1) {
            dw = boxSize;
            dh = boxSize / ir;
          } else {
            dh = boxSize;
            dw = boxSize * ir;
          }
          const dx = bx + (boxSize - dw) / 2;
          const dy = by + (boxSize - dh) / 2;
          drawFramedImage(m.posterImg, dx, dy, dw, dh);
        }

        drawRevealBanner(canvas.width / 2, 62);

        ctx.save();
        ctx.font = "700 32px ui-monospace, Menlo, monospace";
        ctx.fillStyle = "#ede8de";
        ctx.textAlign = "center";
        ctx.fillText(m.artist, canvas.width / 2, canvas.height - 86);

        ctx.font = "600 24px ui-monospace, Menlo, monospace";
        ctx.fillStyle = "#e8a33d";
        ctx.fillText(m.track, canvas.width / 2, canvas.height - 55);
        ctx.restore();

        drawBadge(
          `N° ${itemIdx + 1} / ${items.length}`,
          50,
          canvas.height - 58,
        );
        drawFrameBorder();
      }

      // drapeau centré, coins arrondis + halo, identique en devinette et en
      // réponse (contrairement aux autres types) : c'est le principe même de
      // cette catégorie, voir fetchFlagCategory côté serveur
      function drawFlagBox(m, withinMs) {
        const boxW = 420,
          boxH = 300;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 - 10;

        drawGlowBurst(cx, cy, withinMs, 300);

        if (m.posterImg) {
          const ir = m.posterImg.width / m.posterImg.height;
          let dw, dh;
          if (ir > boxW / boxH) {
            dw = boxW;
            dh = boxW / ir;
          } else {
            dh = boxH;
            dw = boxH * ir;
          }
          const dx = cx - dw / 2;
          const dy = cy - dh / 2;
          drawFramedImage(m.posterImg, dx, dy, dw, dh, 12);
        }
      }

      function drawFlagGuess(m, seg, withinMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameBackdrop();
        drawGameParticles(withinMs);

        drawFlagBox(m, withinMs);

        drawGameProgress(withinMs / seg.dur, canvas.width);

        drawBadge(
          `N° ${seg.itemIdx + 1} / ${items.length}`,
          50,
          canvas.height - 58,
        );
        drawFrameBorder();
      }

      function drawFlagReveal(m, itemIdx, withinMs) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGameBackdrop();
        drawGameParticles(withinMs);

        drawFlagBox(m, withinMs);

        drawRevealBanner(canvas.width / 2, 62);

        ctx.save();
        ctx.font = "700 32px ui-monospace, Menlo, monospace";
        ctx.fillStyle = "#ede8de";
        ctx.textAlign = "center";
        ctx.fillText(m.title, canvas.width / 2, canvas.height - 86);

        ctx.font = "600 24px ui-monospace, Menlo, monospace";
        ctx.fillStyle = "#e8a33d";
        ctx.fillText(`Capitale : ${m.capital}`, canvas.width / 2, canvas.height - 55);
        ctx.restore();

        drawBadge(
          `N° ${itemIdx + 1} / ${items.length}`,
          50,
          canvas.height - 58,
        );
        drawFrameBorder();
      }

      function drawSegment(seg, withinMs) {
        if (seg.type === "splash") {
          drawSplash(withinMs);
          return;
        }
        if (seg.type === "music-guess") {
          drawMusicGuess(seg, withinMs);
          return;
        }
        const m = items[seg.itemIdx];
        if (!m) return;
        if (seg.type === "guess") drawGuess(m, seg, withinMs);
        else if (seg.type === "music-reveal")
          drawMusicReveal(m, seg.itemIdx, withinMs);
        else if (seg.type === "flag-guess") drawFlagGuess(m, seg, withinMs);
        else if (seg.type === "flag-reveal")
          drawFlagReveal(m, seg.itemIdx, withinMs);
        else drawReveal(m, seg.itemIdx, withinMs);
      }
      function findSegment(elapsed) {
        for (const seg of timeline) {
          if (elapsed < seg.start + seg.dur) return seg;
        }
        return timeline[timeline.length - 1];
      }

      // rendu rapide : Mediabunny pilote l'encodeur, la queue interne et les
      // durées de frame — on lui donne juste (timestamp, durée) en secondes
      // pour chaque image dessinée sur le canvas invisible.
      //
      // deux cadences distinctes : on ENCODE à CFG.encodeFps (16fps, pour une
      // lecture bien fluide et calée dès le début — un cadencement
      // d'encodage trop grossier fait "traîner" le calage de lecture du
      // navigateur au tout début, ce qui se traduit ensuite par un décalage
      // audio/vidéo constant), mais on ne REDESSINE (la partie coûteuse :
      // photos, dégradés, texte) qu'à CFG.drawFps (4fps) — les frames
      // d'encodage intermédiaires réencodent simplement le même canvas, ce
      // qui coûte bien moins cher que de le redessiner. Le splash est
      // l'exception : seul moment réellement animé, il est redessiné à
      // chaque frame d'encodage pour rester fluide.
      async function renderFast() {
        const drawFps = CFG.drawFps;
        const encodeFps = CFG.encodeFps;
        const encodeFrameDurationSec = 1 / encodeFps;
        const totalEncodeFrames = Math.max(
          1,
          Math.round((totalDurationMs / 1000) * encodeFps),
        );
        // nombre de frames d'encodage entre deux redessins réels (hors splash)
        const drawEveryNEncodeFrames = Math.max(
          1,
          Math.round(encodeFps / drawFps),
        );

        const output = new Mediabunny.Output({
          format: new Mediabunny.Mp4OutputFormat(),
          target: new Mediabunny.BufferTarget(),
        });

        const videoSource = new Mediabunny.CanvasSource(canvas, {
          codec: "avc",
          bitrate: Mediabunny.QUALITY_HIGH,
        });
        output.addVideoTrack(videoSource);

        const audioSource = new Mediabunny.AudioBufferSource({
          codec: "aac",
          bitrate: Mediabunny.QUALITY_HIGH,
        });
        output.addAudioTrack(audioSource);

        await output.start();

        // piste audio : le buffer musical couvre déjà écoute + fondu sur la
        // réponse (voir trimAudioBufferWithFade), donc on l'ajoute une seule
        // fois et on saute le segment "music-reveal" suivant qu'il couvre déjà.
        // Idem pour la piste "devinette" : un seul buffer couvrant toute la
        // phase de devinette d'un item, on saute donc les segments "guess"
        // suivants du même item qu'il couvre déjà. Splash a sa propre piste
        // fournie ; la réponse (hors musique) reste silencieuse, comme
        // partout où aucune piste n'est disponible, pour garder l'audio
        // synchronisé.
        setStatus("Préparation de la piste audio…", "rec");
        for (let i = 0; i < timeline.length; i++) {
          const seg = timeline[i];
          if (seg.type === "splash") {
            await audioSource.add(splashAudioBuffer || silentBuffer(seg.dur));
          } else if (seg.type === "music-guess") {
            await audioSource.add(items[seg.itemIdx].audioBuffer);
            const next = timeline[i + 1];
            if (
              next &&
              next.type === "music-reveal" &&
              next.itemIdx === seg.itemIdx
            ) {
              i++; // déjà couvert par le buffer ajouté ci-dessus
            }
          } else if (seg.type === "guess" && seg.imgIdx === 0) {
            const m = items[seg.itemIdx];
            await audioSource.add(
              m.guessAudioBuffer || silentBuffer(seg.itemGuessDur),
            );
            while (
              timeline[i + 1] &&
              timeline[i + 1].type === "guess" &&
              timeline[i + 1].itemIdx === seg.itemIdx
            ) {
              i++; // déjà couvert par le buffer de devinette ajouté ci-dessus
            }
          } else if (seg.type === "flag-guess") {
            const m = items[seg.itemIdx];
            await audioSource.add(m.guessAudioBuffer || silentBuffer(seg.dur));
          } else {
            await audioSource.add(silentBuffer(seg.dur));
          }
        }
        audioSource.close();

        for (let i = 0; i < totalEncodeFrames; i++) {
          const elapsedMs = (i / encodeFps) * 1000;
          const seg = findSegment(elapsedMs);
          // le splash est le seul moment vraiment animé (rebond du logo,
          // halo, confettis) : on le redessine à chaque frame d'encodage
          // pour une animation fluide, contrairement au reste de la vidéo
          // (photos fixes) qui n'a besoin que du rythme visuel habituel
          if (seg.type === "splash" || i % drawEveryNEncodeFrames === 0) {
            drawSegment(seg, elapsedMs - seg.start);
          }

          await videoSource.add(
            i * encodeFrameDurationSec,
            encodeFrameDurationSec,
          );

          if (i % 90 === 0) {
            setProgress((i / totalEncodeFrames) * 100);
            setStatus(
              `Rendu en cours : image ${i}/${totalEncodeFrames}…`,
              "rec",
            );
            await new Promise((r) => setTimeout(r, 0)); // laisse respirer l'UI/event loop
          }
        }
        videoSource.close();

        await output.finalize();
        const buffer = output.target.buffer;
        setProgress(100);
        return { blob: new Blob([buffer], { type: "video/mp4" }), ext: "mp4" };
      }

      // repli temps réel (navigateurs sans WebCodecs) : capture le canvas en direct
      function renderRealtime() {
        return new Promise((resolve, reject) => {
          const stream = canvas.captureStream(CFG.drawFps);
          const mimeType = MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9",
          )
            ? "video/webm;codecs=vp9"
            : "video/webm";
          const mediaRecorder = new MediaRecorder(stream, { mimeType });
          const chunks = [];
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size) chunks.push(e.data);
          };
          mediaRecorder.onstop = () =>
            resolve({
              blob: new Blob(chunks, { type: "video/webm" }),
              ext: "webm",
            });
          mediaRecorder.onerror = reject;
          mediaRecorder.start();

          const startTs = performance.now();
          function frame(now) {
            const elapsed = now - startTs;
            if (elapsed >= totalDurationMs) {
              const last = timeline[timeline.length - 1];
              drawSegment(last, last.dur);
              mediaRecorder.stop();
              return;
            }
            const seg = findSegment(elapsed);
            drawSegment(seg, elapsed - seg.start);
            setProgress((elapsed / totalDurationMs) * 100);
            requestAnimationFrame(frame);
          }
          setStatus(
            `Rendu en temps réel (${formatDuration(totalDurationMs / 1000)}) — ton navigateur ne supporte pas l'encodage rapide…`,
            "rec",
          );
          requestAnimationFrame(frame);
        });
      }

      async function generateQuiz() {
        btnGenerate.disabled = true;
        resultRow.classList.remove("show");
        answersEl.classList.remove("show");
        answersRevealed = false;
        resetStage();
        setProgress(0);

        // démarré en parallèle (pas attendu tout de suite) pour chevaucher
        // avec la récupération du lot et le préchargement des images
        const logoImgPromise = logoImg
          ? Promise.resolve(logoImg)
          : loadImage("/logo.png").catch((e) => {
              console.warn("Logo indisponible pour le splash :", e.message);
              return null;
            });

        try {
          const count = Math.min(100, Math.max(5, currentCount()));
          const imagesPerItem = Math.min(
            5,
            Math.max(1, currentImagesPerItem()),
          );
          const categories = [...selectedCategories].join(",");
          const exclude = getSeenIds().join(",");

          setStatus(
            `Récupération d\u2019un lot de ${count} titres (${imagesPerItem} images chacun)…`,
          );
          setStagePlaceholder("Récupération de la liste des titres…");
          const res = await fetch(
            `/api/quiz-batch?count=${count}&imagesPerItem=${imagesPerItem}&categories=${categories}&exclude=${exclude}`,
          );
          if (!res.ok)
            throw new Error((await res.json()).error || res.statusText);
          const data = await res.json();

          if (data.recycled) {
            clearSeenIds();
            setStatus(
              "Réservoir épuisé pour ces catégories, historique réinitialisé.",
            );
          }
          if (data.excludedCount > 0) {
            setStatus(
              `${data.excludedCount} titre(s) écarté(s) faute d\u2019image sans texte exploitable.`,
            );
          }

          setStagePlaceholder("Préchargement des images et extraits audio…");
          items = await preloadAll(data.items);
          addSeenIds(data.items.map((m) => m.id));
          const failedCount = data.items.length - items.length;
          if (failedCount > 0) {
            setStatus(
              `${failedCount} image(s) illisible(s) côté navigateur, exclue(s) du quiz.`,
            );
          }
          if (items.length === 0) {
            throw new Error(
              "Aucune image n'a pu être chargée pour ce lot, réessaie.",
            );
          }

          // pistes audio fournies (splash / devinette), toujours rejouées
          // depuis leur début — seul le rendu rapide sait encoder de
          // l'audio, inutile de les charger pour le repli temps réel
          if (supportsFastEncode) {
            setStagePlaceholder("Préparation des pistes audio…");
            const [splashSrc, guessingSrc] = await Promise.all([
              loadCueBuffer("splash"),
              loadCueBuffer("guessing"),
            ]);
            splashAudioBuffer = loopBufferToDuration(
              splashSrc,
              CFG.splashMs / 1000,
            );
            for (const m of items) {
              if (m.mediaType === "music") continue;
              const guessDurSec =
                m.mediaType === "flag"
                  ? currentFlagSec()
                  : m.backdropImgs.length * currentImageSec();
              m.guessAudioBuffer = applyGuessingVolumeAndFadeOut(
                loopBufferToDuration(guessingSrc, guessDurSec),
              );
            }
          } else {
            splashAudioBuffer = null;
          }

          logoImg = await logoImgPromise;

          const built = buildTimeline(
            currentImageSec() * 1000,
            currentRevealSec() * 1000,
            CFG.splashMs,
            currentMusicClipSec() * 1000,
            currentFlagSec() * 1000,
          );
          timeline = built.timeline;
          totalDurationMs = built.total;

          const hasMusic = items.some((m) => m.mediaType === "music");
          setStagePlaceholder(
            supportsFastEncode
              ? "Rendu rapide en cours (canvas invisible)…"
              : hasMusic
                ? "Rendu en cours (temps réel — attention, ce mode de repli ne supporte pas encore l'audio, la vidéo sera muette)…"
                : "Rendu en cours (temps réel, navigateur non compatible WebCodecs)…",
          );
          if (!supportsFastEncode && hasMusic) {
            setStatus(
              "Ton navigateur ne supporte pas le rendu rapide : la vidéo sera générée sans le son des extraits musicaux.",
              "err",
            );
          }
          setProgress(0);

          const { blob, ext } = supportsFastEncode
            ? await renderFast()
            : await renderRealtime();
          const url = URL.createObjectURL(blob);

          stage.innerHTML = "";
          const video = document.createElement("video");
          video.src = url;
          video.controls = true;
          stage.appendChild(video);

          downloadLink.href = url;
          downloadLink.download = `guess-it.${ext}`;
          resultRow.classList.add("show");
          setStatus(
            "Vidéo générée — prête à être visionnée (plein écran natif du lecteur).",
          );
          setProgress(100);
          refreshStats();
        } catch (e) {
          console.error(e);
          setStatus("Erreur : " + e.message, "err");
          setStagePlaceholder("Erreur pendant la génération.");
        } finally {
          btnGenerate.disabled = false;
        }
      }

      countRange.addEventListener("input", () => {
        countNumber.value = countRange.value;
        updateDurationHint();
        saveSettings();
      });
      countNumber.addEventListener("input", () => {
        const max = parseInt(countNumber.max, 10) || 100;
        const v = Math.min(
          max,
          Math.max(5, parseInt(countNumber.value, 10) || 5),
        );
        countRange.value = v;
        updateDurationHint();
        saveSettings();
      });
      imagesPerItemRange.addEventListener("input", () => {
        imagesPerItemNumber.value = imagesPerItemRange.value;
        updateDurationHint();
        saveSettings();
      });
      imagesPerItemNumber.addEventListener("input", () => {
        imagesPerItemRange.value = imagesPerItemNumber.value;
        updateDurationHint();
        saveSettings();
      });
      imageSecRange.addEventListener("input", () => {
        imageSecNumber.value = imageSecRange.value;
        updateDurationHint();
        saveSettings();
      });
      imageSecNumber.addEventListener("input", () => {
        imageSecRange.value = imageSecNumber.value;
        updateDurationHint();
        saveSettings();
      });
      revealSecRange.addEventListener("input", () => {
        revealSecNumber.value = revealSecRange.value;
        updateDurationHint();
        saveSettings();
      });
      revealSecNumber.addEventListener("input", () => {
        revealSecRange.value = revealSecNumber.value;
        updateDurationHint();
        saveSettings();
      });
      musicClipSecRange.addEventListener("input", () => {
        musicClipSecNumber.value = musicClipSecRange.value;
        updateDurationHint();
        saveSettings();
      });
      musicClipSecNumber.addEventListener("input", () => {
        musicClipSecRange.value = musicClipSecNumber.value;
        updateDurationHint();
        saveSettings();
      });
      flagSecRange.addEventListener("input", () => {
        flagSecNumber.value = flagSecRange.value;
        updateDurationHint();
        saveSettings();
      });
      flagSecNumber.addEventListener("input", () => {
        flagSecRange.value = flagSecNumber.value;
        updateDurationHint();
        saveSettings();
      });
      categorySearch.addEventListener("input", () => {
        categoryFilter = categorySearch.value;
        renderChips();
      });

      btnGenerate.addEventListener("click", generateQuiz);
      btnToggleAnswers.addEventListener("click", () => {
        answersRevealed = !answersRevealed;
        if (answersRevealed) {
          answersEl.innerHTML = items
            .map((m, i) => `<span>${i + 1}. ${m.title}</span>`)
            .join("<br>");
          answersEl.classList.add("show");
          btnToggleAnswers.textContent = "Masquer la liste des titres";
        } else {
          answersEl.classList.remove("show");
          btnToggleAnswers.textContent = "Voir la liste des titres";
        }
      });

      updateDurationHint();
      refreshStats();
      loadCategories()
        .then(() =>
          setStatus(
            supportsFastEncode
              ? "Prêt — choisis tes réglages puis clique sur « Générer le quizz »."
              : mediabunnyLoadError
                ? "Prêt (rendu temps réel — la dépendance de rendu rapide n'a pas pu être chargée, réessaie plus tard)."
                : "Prêt (rendu temps réel, WebCodecs non supporté par ce navigateur).",
          ),
        )
        .catch((e) => setStatus("Erreur catégories : " + e.message, "err"));
    </script>
  </body>
