<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess It</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a10;
        --panel: #16151f;
        --cream: #ede8de;
        --amber: #e8a33d;
        --green: #4c8a5c;
        --muted: #7a7a85;
        --cyan: #4fd1e8;
        --purple: #9d5ce6;
        --mono:
          ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas,
          monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --game: "Baloo 2", var(--sans);
      }
      * {
        box-sizing: border-box;
      }
      body {
        position: relative;
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 12% 18%,
            rgba(79, 209, 232, 0.09),
            transparent 38%
          ),
          radial-gradient(
            circle at 88% 78%,
            rgba(157, 92, 230, 0.12),
            transparent 42%
          ),
          radial-gradient(ellipse at 50% -10%, #201c30 0%, var(--bg) 60%);
        color: var(--cream);
        font-family: var(--sans);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.045) 1.2px,
          transparent 1.2px
        );
        background-size: 28px 28px;
        pointer-events: none;
        z-index: 0;
      }
      .rig {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 760px;
      }
      .topbar {
        position: absolute;
        top: -12px;
        right: 0;
      }
      .hero {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 4px 0 12px;
      }
      .hero-logo-wrap {
        position: relative;
        display: inline-flex;
        flex-shrink: 0;
      }
      .hero-logo-wrap::before {
        content: "";
        position: absolute;
        inset: -18px;
        background: radial-gradient(
          circle,
          rgba(79, 209, 232, 0.28) 0%,
          rgba(157, 92, 230, 0.16) 45%,
          transparent 72%
        );
        animation: glow-pulse 4s ease-in-out infinite;
        z-index: 0;
      }
      .hero-logo {
        position: relative;
        z-index: 1;
        display: block;
        height: 150px;
        width: auto;
        animation: logo-float 4.5s ease-in-out infinite;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
      }
      @keyframes logo-float {
        0%,
        100% {
          transform: translateY(0) rotate(-1.5deg);
        }
        50% {
          transform: translateY(-7px) rotate(1.5deg);
        }
      }
      @keyframes glow-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      .version-badge {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--muted);
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 255, 255, 0.02);
        padding: 3px 9px;
        border-radius: 20px;
        white-space: nowrap;
        opacity: 0.75;
      }
      .status-led {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-left: 8px;
        vertical-align: middle;
        background: var(--muted);
        transition:
          background 0.3s,
          box-shadow 0.3s;
      }
      .status-led.led-red {
        background: #d9694f;
        box-shadow: 0 0 6px rgba(217, 105, 79, 0.8);
      }
      .status-led.led-green {
        background: var(--green);
        box-shadow: 0 0 6px rgba(76, 138, 92, 0.8);
        animation: led-pulse 2.4s ease-in-out infinite;
      }
      @keyframes led-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      h1 {
        font-family: var(--game);
        text-align: center;
        font-size: clamp(30px, 5.5vw, 44px);
        margin: 0 0 6px;
        font-weight: 800;
        letter-spacing: 0.01em;
        background: linear-gradient(
          120deg,
          var(--cream) 30%,
          var(--cyan) 68%,
          var(--purple) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-stroke: 1px rgba(0, 0, 0, 0.3);
        text-shadow:
          0 3px 0 rgba(0, 0, 0, 0.22),
          0 10px 24px rgba(79, 209, 232, 0.15);
      }
      .stats-line {
        text-align: center;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        opacity: 0.75;
        margin: 22px 0 0;
      }
      .card {
        position: relative;
        background: var(--panel);
        border: 1px solid rgba(157, 92, 230, 0.22);
        border-radius: 22px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04) inset,
          0 30px 70px -24px rgba(0, 0, 0, 0.7),
          0 0 44px -14px rgba(79, 209, 232, 0.18);
        overflow: hidden;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 2px;
        border-radius: 22px;
        background: linear-gradient(
          135deg,
          var(--cyan),
          var(--purple) 55%,
          var(--amber)
        );
        opacity: 0.45;
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .settings {
        padding: 20px 22px;
        border-bottom: 1px solid rgba(157, 92, 230, 0.16);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .settings-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        min-width: 110px;
      }
      input[type="number"] {
        width: 62px;
        background: linear-gradient(180deg, #1e1c2a, #131118);
        border: 1px solid rgba(157, 92, 230, 0.4);
        color: var(--cyan);
        font-family: var(--mono);
        font-weight: 700;
        font-size: 14px;
        padding: 8px 6px;
        border-radius: 8px;
        text-align: center;
        outline: none;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input[type="number"]:focus {
        border-color: var(--cyan);
        box-shadow:
          inset 0 2px 5px rgba(0, 0, 0, 0.5),
          0 0 0 3px rgba(79, 209, 232, 0.2);
      }

      /* piste + curseur des sliders façon "jeu" : jauge dégradée + gemme */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1 1 140px;
        height: 10px;
        border-radius: 20px;
        background: linear-gradient(
          90deg,
          rgba(79, 209, 232, 0.85),
          rgba(157, 92, 230, 0.85)
        );
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        border-radius: 20px;
        background: transparent;
      }
      input[type="range"]::-moz-range-track {
        height: 10px;
        border-radius: 20px;
        background: linear-gradient(
          90deg,
          rgba(79, 209, 232, 0.85),
          rgba(157, 92, 230, 0.85)
        );
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        margin-top: -6px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.65);
        background: radial-gradient(
          circle at 35% 30%,
          #fff5da 0%,
          var(--amber) 55%,
          #a5701f 100%
        );
        box-shadow:
          0 0 0 4px rgba(232, 163, 61, 0.22),
          0 2px 6px rgba(0, 0, 0, 0.55);
        cursor: pointer;
        transition: transform 0.15s;
      }
      input[type="range"]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(255, 255, 255, 0.65);
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #fff5da 0%,
          var(--amber) 55%,
          #a5701f 100%
        );
        box-shadow:
          0 0 0 4px rgba(232, 163, 61, 0.22),
          0 2px 6px rgba(0, 0, 0, 0.55);
        cursor: pointer;
        transition: transform 0.15s;
      }
      input[type="range"]:hover::-webkit-slider-thumb,
      input[type="range"]:focus-visible::-webkit-slider-thumb {
        transform: scale(1.15);
      }
      input[type="range"]:hover::-moz-range-thumb,
      input[type="range"]:focus-visible::-moz-range-thumb {
        transform: scale(1.15);
      }

      /* champ de recherche : fond texturé + loupe + halo violet au focus */
      .search-wrap {
        position: relative;
        flex: 1 1 200px;
      }
      .search-wrap .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        opacity: 0.55;
        pointer-events: none;
      }
      input[type="text"].search-input {
        width: 100%;
        background:
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.015) 0px,
            rgba(255, 255, 255, 0.015) 2px,
            transparent 2px,
            transparent 9px
          ),
          #131118;
        border: 1px solid rgba(157, 92, 230, 0.35);
        color: var(--cream);
        font-family: var(--sans);
        font-size: 13px;
        padding: 9px 12px 9px 32px;
        border-radius: 10px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input[type="text"].search-input:focus {
        border-color: var(--purple);
        box-shadow: 0 0 0 3px rgba(157, 92, 230, 0.25);
      }
      .chip-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .chip-group-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-height: 150px;
        overflow-y: auto;
        padding: 2px;
      }
      .chip {
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 11px;
        border-radius: 20px;
        border: 1px solid rgba(157, 92, 230, 0.18);
        background: rgba(157, 92, 230, 0.05);
        color: var(--muted);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s,
          box-shadow 0.15s;
      }
      .chip.active {
        border-color: var(--amber);
        color: var(--amber);
        background: rgba(232, 163, 61, 0.1);
        animation: chip-pop 0.2s ease-out;
      }
      /* badges de type de contenu : plus grands, translucides, halo cyan une fois actifs */
      .chip.chip-type {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 13px;
        padding: 9px 16px;
        border-radius: 14px;
        border: 2px solid rgba(157, 92, 230, 0.25);
        background: rgba(157, 92, 230, 0.08);
      }
      .chip.chip-type.active {
        border-color: var(--cyan);
        color: var(--cyan);
        background: rgba(79, 209, 232, 0.14);
        box-shadow:
          0 0 16px rgba(79, 209, 232, 0.35),
          inset 0 0 12px rgba(79, 209, 232, 0.08);
      }
      @keyframes chip-pop {
        0% {
          transform: scale(0.92);
        }
        100% {
          transform: scale(1);
        }
      }
      .chip:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      .chip .count {
        opacity: 0.6;
        margin-left: 4px;
      }
      .duration-hint {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      .stage {
        position: relative;
        background: #000;
        aspect-ratio: 16/9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .stage video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #000;
      }
      .stage-placeholder {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        padding: 24px;
        line-height: 1.7;
        white-space: pre-line;
      }

      .progress {
        height: 3px;
        background: rgba(157, 92, 230, 0.15);
      }
      .progress-bar {
        position: relative;
        height: 100%;
        width: 0%;
        background: var(--amber);
        transition: width 0.15s;
        overflow: hidden;
      }
      .progress-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: shimmer 1.4s ease-in-out infinite;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: center;
        padding: 20px 22px;
        border-top: 1px solid rgba(157, 92, 230, 0.16);
      }
      button {
        font-family: var(--game);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
        padding: 12px 26px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, var(--amber), #f0c04d);
        color: #24160a;
        cursor: pointer;
        box-shadow:
          0 6px 0 #a5701f,
          0 10px 22px rgba(232, 163, 61, 0.35);
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.12s,
          box-shadow 0.12s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow:
          0 8px 0 #a5701f,
          0 14px 26px rgba(232, 163, 61, 0.4);
      }
      button:active:not(:disabled) {
        transform: translateY(2px) scale(0.98);
        box-shadow:
          0 2px 0 #a5701f,
          0 4px 10px rgba(232, 163, 61, 0.3);
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
      button.ghost {
        background: rgba(157, 92, 230, 0.1);
        color: var(--cream);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      button.ghost:hover:not(:disabled) {
        background: rgba(157, 92, 230, 0.18);
        transform: translateY(-2px);
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
      }
      button.ghost:active:not(:disabled) {
        transform: translateY(2px) scale(0.98);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
      }
      .status {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        padding: 0 20px 18px;
      }
      .status.rec {
        color: var(--green);
      }
      .status.rec::before {
        content: "● ";
      }
      .status.err {
        color: #d9694f;
      }

      .result-row {
        display: none;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 0 20px 18px;
      }
      .result-row.show {
        display: flex;
      }
      .result-row a {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--amber);
        text-decoration: none;
        border-bottom: 1px solid var(--amber);
      }
      .answers {
        display: none;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        padding: 0 20px 20px;
        line-height: 1.8;
        max-height: 200px;
        overflow-y: auto;
      }
      .answers.show {
        display: block;
      }
      .answers span {
        color: var(--cream);
      }
      .hint {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="rig">
      <div class="topbar">
        <span class="version-badge" id="appVersion"></span
        ><span
          class="status-led"
          id="serverStatusLed"
          title="État du serveur : réservoir et caches"
        ></span>
      </div>
      <div class="hero">
        <div class="hero-logo-wrap">
          <img src="/logo.png" alt="Guess It" class="hero-logo" />
        </div>
      </div>
      <h1>Configure ton quiz</h1>

      <div class="card">
        <div class="settings">
          <div class="settings-row">
            <span class="settings-label" id="typeLabel">Type</span>
            <div
              id="chipsContentType"
              class="chips"
              role="group"
              aria-labelledby="typeLabel"
            ></div>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="countRange"
              >Nombre de titres</label
            >
            <input
              type="range"
              id="countRange"
              min="5"
              max="100"
              step="1"
              value="10"
            />
            <input
              type="number"
              id="countNumber"
              min="5"
              max="100"
              value="10"
            />
            <span
              id="countCapNote"
              class="hint"
              style="display: none; margin: 0"
            ></span>
          </div>
          <div class="settings-row" id="rowImagesPerItem">
            <label class="settings-label" for="imagesPerItemRange"
              >Images / titre</label
            >
            <input
              type="range"
              id="imagesPerItemRange"
              min="1"
              max="5"
              step="1"
              value="3"
            />
            <input
              type="number"
              id="imagesPerItemNumber"
              min="1"
              max="5"
              value="3"
            />
          </div>
          <div class="settings-row" id="rowImageSec">
            <label class="settings-label" for="imageSecRange"
              >Temps / image</label
            >
            <input
              type="range"
              id="imageSecRange"
              min="2"
              max="10"
              step="1"
              value="5"
            />
            <input
              type="number"
              id="imageSecNumber"
              min="2"
              max="10"
              value="5"
            /><span class="settings-label" style="min-width: auto">sec</span>
          </div>
          <div class="settings-row">
            <label class="settings-label" for="revealSecRange"
              >Temps réponse</label
            >
            <input
              type="range"
              id="revealSecRange"
              min="2"
              max="15"
              step="1"
              value="5"
            />
            <input
              type="number"
              id="revealSecNumber"
              min="2"
              max="15"
              value="5"
            /><span class="settings-label" style="min-width: auto">sec</span>
          </div>
          <div class="settings-row" id="rowMusicClip">
            <label class="settings-label" for="musicClipSecRange"
              >Extrait audio</label
            >
            <input
              type="range"
              id="musicClipSecRange"
              min="3"
              max="28"
              step="1"
              value="10"
            />
            <input
              type="number"
              id="musicClipSecNumber"
              min="3"
              max="28"
              value="10"
            />
          </div>
          <div class="settings-row" id="rowFlagSec">
            <label class="settings-label" for="flagSecRange"
              >Temps drapeau</label
            >
            <input
              type="range"
              id="flagSecRange"
              min="2"
              max="10"
              step="1"
              value="5"
            />
            <input
              type="number"
              id="flagSecNumber"
              min="2"
              max="10"
              value="5"
            /><span class="settings-label" style="min-width: auto">sec</span>
          </div>

          <div class="settings-row">
            <label class="settings-label" for="categorySearch"
              >Rechercher</label
            >
            <div class="search-wrap">
              <span class="search-icon" aria-hidden="true">🔎</span>
              <input
                type="text"
                id="categorySearch"
                class="search-input"
                placeholder="Filtrer les catégories..."
                autocomplete="off"
              />
            </div>
          </div>

          <div class="chip-group">
            <span class="chip-group-label" id="listesLabel">Listes</span>
            <div
              id="chipsListes"
              class="chips"
              role="group"
              aria-labelledby="listesLabel"
            >
              <span class="settings-label" style="min-width: auto"
                >chargement…</span
              >
            </div>
          </div>
          <div class="chip-group">
            <span class="chip-group-label" id="decadesLabel">Décennies</span>
            <div
              id="chipsDecades"

    <script type="module">
      // import dynamique : si le CDN jsDelivr est indisponible/lent, on ne
      // casse pas toute la page — on bascule proprement sur le repli temps
      // réel (qui n'a pas besoin de Mediabunny) avec un message clair.
      let Mediabunny = null;
      let mediabunnyLoadError = null;
      try {
        Mediabunny =
          await import("https://cdn.jsdelivr.net/npm/mediabunny/+esm");
      } catch (e) {
        mediabunnyLoadError = e;
        console.error("Mediabunny indisponible (CDN down ?):", e);
      }

      const CFG = {
        preloadConcurrency: 8,
        drawFps: 12, // cadence de redessin du contenu (hors splash) : photos, textes, etc.
        encodeFps: 12, // cadence d'encodage/conteneur vidéo (fluidité de lecture, notamment le splash)
        splashMs: 5000,
      };
      const STORAGE_PREFIX = "guessit_seen_";
      const SETTINGS_KEY = "guessit_settings";

      // canvas de rendu, jamais attaché au DOM : sert uniquement de source aux frames encodées

      const musicClipSecRange = document.getElementById("musicClipSecRange");
      const musicClipSecNumber = document.getElementById("musicClipSecNumber");

      const chipsDecades = document.getElementById("chipsDecades");

      // état de la session en cours
      let activeContentTypes = new Set(["movie"]); // sous-ensemble de {'movie','tv','person'}
      let availableCategories = [];

      let categoryFilter = "";

      let items = [];
      let timeline = [];

      let answersRevealed = false;
      let splashAudioBuffer = null;
      let logoImg = null; // logo préchargé une fois, dessiné de façon synchrone par drawSplash

      function typeActive(mediaType) {
        return activeContentTypes.has(mediaType);
      }

      // chip cliquable + accessible clavier (rôle bouton, Entrée/Espace, aria-pressed)
      function makeChip(innerHTML, active, onActivate, extraClass) {
        const chip = document.createElement("span");
        chip.className =
          "chip" +
          (extraClass ? " " + extraClass : "") +
          (active ? " active" : "");
        chip.innerHTML = innerHTML;
        chip.setAttribute("role", "button");
        chip.setAttribute("tabindex", "0");
        chip.setAttribute("aria-pressed", active ? "true" : "false");
        chip.addEventListener("click", onActivate);
        chip.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            onActivate();
          }
        });
        return chip;
      }

      // affiche/masque les réglages qui ne s'appliquent pas aux types actifs
      function updateSettingsVisibility() {
        const hasMusic = typeActive("music");
        const hasFlag = typeActive("flag");
        // "flag" a sa propre durée dédiée (comme la musique), donc pas
        // besoin d'images/titre ni de temps/image tant que rien d'autre
        // n'est actif
        const hasStandard = [...activeContentTypes].some(
          (t) => t !== "music" && t !== "flag",

        rowFlagSec.style.display = hasFlag ? "" : "none";
        rowImagesPerItem.style.display = hasStandard ? "" : "none";
        rowImageSec.style.display = hasStandard ? "" : "none";
      }

      const supportsFastEncode =
        Mediabunny !== null &&
        typeof VideoEncoder === "function" &&
        typeof VideoFrame === "function";

      async function refreshStats() {
        try {
          const res = await fetch("/api/stats");
          const data = await res.json();
          if (data.version) appVersion.textContent = `v${data.version}`;
          serverStatusLed.className =
            "status-led " + (data.ready ? "led-green" : "led-red");
          serverStatusLed.title = data.ready
            ? "Serveur prêt : réservoir et caches à jour"
            : "Serveur en préparation : réservoir ou caches encore en cours de chauffe";
          let text = `Quiz générés au total : ${data.totalGenerated}`;
          if (data.topCategories && data.topCategories.length) {
            text +=
              " · Top : " +
              data.topCategories
                .map((c) => `${c.label} (${c.count})`)
                .join(", ");
          }
          statsLine.textContent = text;
          // tant que ce n'est pas prêt, on revérifie régulièrement pour que
          // la LED passe au vert toute seule sans que l'utilisateur recharge
          if (!data.ready) setTimeout(refreshStats, 20000);
        } catch {
          statsLine.textContent = "Quiz générés au total : —";
          serverStatusLed.className = "status-led led-red";
        }
      }

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = "status" + (cls ? " " + cls : "");
      }
      function setProgress(pct) {
        progressBar.style.width = pct + "%";
      }

      function currentCount() {
        return parseInt(countNumber.value, 10) || 5;
      }
      function currentImagesPerItem() {
        return parseInt(imagesPerItemNumber.value, 10) || 1;
      }
      function currentImageSec() {
        return parseInt(imageSecNumber.value, 10) || 5;
      }
      function currentRevealSec() {
        return parseInt(revealSecNumber.value, 10) || 5;
      }
      function currentMusicClipSec() {
        return Math.min(28, parseInt(musicClipSecNumber.value, 10) || 10);
      }
      function currentFlagSec() {
        return parseInt(flagSecNumber.value, 10) || 5;
      }

      function formatDuration(totalSec) {
        const m = Math.floor(totalSec / 60),
          s = Math.round(totalSec % 60);
        return `${m} min ${s.toString().padStart(2, "0")}`;
      }
      function totalDurationSec() {
        // musique et drapeaux ont chacun leur propre durée dédiée (pas
        // images/titre ni temps/image) : leur durée par item diffère de
        // celle des autres médias. Le lot final pioche dans le pool
        // fusionné des catégories sélectionnées, donc on pondère par la
        // part de chaque catégorie de durée dans ce pool plutôt que de tout
        // calculer avec la formule "image"
        const itemSecByBucket = {
          music: currentMusicClipSec() + currentRevealSec(),
          flag: currentFlagSec() + currentRevealSec(),
          standard:
            currentImagesPerItem() * currentImageSec() + currentRevealSec(),
        };
        const bucketOf = (mediaType) =>
          mediaType === "music" || mediaType === "flag" ? mediaType : "standard";

        const selected = availableCategories.filter((c) =>
          selectedCategories.has(c.key),
        );
        const totalAvailable = selected.reduce((s, c) => s + c.available, 0);
        const availableByBucket = { music: 0, flag: 0, standard: 0 };
        for (const c of selected) {
          availableByBucket[bucketOf(c.mediaType)] += c.available;
        }

        let avgItemSec;
        if (totalAvailable > 0) {
          avgItemSec = Object.entries(availableByBucket).reduce(
            (sum, [bucket, avail]) =>
              sum + (avail / totalAvailable) * itemSecByBucket[bucket],
            0,
          );
        } else {
          // pool encore inconnu (ex: juste après un changement de type) :
          // à défaut de mieux, suppose que tous les types actifs partagent
          // le même seul bucket de durée s'ils y correspondent tous
          const activeBuckets = new Set(
            [...activeContentTypes].map(bucketOf),
          );
          const bucket =
            activeBuckets.size === 1 ? [...activeBuckets][0] : "standard";
          avgItemSec = itemSecByBucket[bucket];
        }
        return currentCount() * avgItemSec;
      }
      function updateDurationHint() {
        durationHint.textContent = `Durée estimée : ${formatDuration(totalDurationSec())} · max disponible : ${currentMaxAvailable}`;
      }

      function storageKey() {
        const cats = [...selectedCategories].sort().join("+") || "none";
        return STORAGE_PREFIX + cats;
      }
      function getSeenIds() {
        try {
          return JSON.parse(localStorage.getItem(storageKey()) || "[]");
        } catch {
          return [];
        }
      }
      function addSeenIds(ids) {
        const current = new Set(getSeenIds());
        ids.forEach((id) => current.add(id));
        localStorage.setItem(storageKey(), JSON.stringify([...current]));
      }
      function clearSeenIds() {
        localStorage.removeItem(storageKey());
      }

      function saveSettings() {
        const s = {
          count: currentCount(),
          imagesPerItem: currentImagesPerItem(),
          imageSec: currentImageSec(),
          revealSec: currentRevealSec(),
          musicClipSec: currentMusicClipSec(),
          flagSec: currentFlagSec(),
          contentTypes: [...activeContentTypes],
          categories: [...selectedCategories],
        };
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
        } catch {}
      }
      function loadSettings() {
        try {
          return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
        } catch {
          return null;
        }
      }
      function applySavedSettings() {
        const s = loadSettings();
        if (!s) return;
        if (s.count) {
          countNumber.value = s.count;
          countRange.value = s.count;
        }
        if (s.imagesPerItem) {
          imagesPerItemNumber.value = s.imagesPerItem;
          imagesPerItemRange.value = s.imagesPerItem;
        }
        if (s.imageSec) {
          imageSecNumber.value = s.imageSec;
          imageSecRange.value = s.imageSec;
        }
        if (s.revealSec) {
          revealSecNumber.value = s.revealSec;
          revealSecRange.value = s.revealSec;
        }
        if (s.musicClipSec) {
          musicClipSecNumber.value = s.musicClipSec;
          musicClipSecRange.value = s.musicClipSec;
        }
        if (s.flagSec) {
          flagSecNumber.value = s.flagSec;
          flagSecRange.value = s.flagSec;
        }
        if (Array.isArray(s.contentTypes)) {
          const valid = s.contentTypes.filter(
            (t) =>
              t === "movie" ||
              t === "tv" ||
              t === "person" ||
              t === "game" ||
              t === "music" ||
              t === "country" ||
              t === "painting" ||
              t === "flag",
          );
          if (valid.length) activeContentTypes = new Set(valid);
        }
        if (Array.isArray(s.categories) && s.categories.length) {
          const valid = s.categories.filter((c) =>
            availableCategories.some((ac) => ac.key === c),
          );
          if (valid.length) selectedCategories = new Set(valid);
        }
      }

      async function loadCategories() {
        const res = await fetch("/api/categories");
        const data = await res.json();
        availableCategories = data.categories;
        selectedCategories = new Set(
          availableCategories
            .filter((c) => c.key === "popular" || c.key === "top_rated")
            .map((c) => c.key),
        );
        applySavedSettings();
        renderContentTypeChips();
        updateSettingsVisibility();
        renderChips();
        await updatePoolSize();
      }

      function renderContentTypeChips() {
        chipsContentType.innerHTML = "";
        const options = [
          { key: "movie", label: "🎬 Films" },
          { key: "tv", label: "📺 Séries" },
          { key: "person", label: "🎭 Acteurs" },
          { key: "game", label: "🎮 Jeux vidéo" },
          { key: "music", label: "🎵 Musique" },

                activeContentTypes.delete(opt.key);

                activeContentTypes.add(opt.key);

              renderContentTypeChips();
              updateSettingsVisibility();

                [...selectedCategories].filter((k) => {

                  ...(typeActive("movie") ? ["popular", "top_rated"] : []),
                  ...(typeActive("tv") ? ["tv_popular", "tv_top_rated"] : []),
                  ...(typeActive("person") ? ["person_popular"] : []),
                  ...(typeActive("game") ? ["game_popular"] : []),
                  ...(typeActive("music") ? ["music_popular_fr"] : []),
                  ...(typeActive("country") ? ["country_all"] : []),
                  ...(typeActive("painting") ? ["painting_popular"] : []),

                    availableCategories.some((c) => c.key === k),

      function renderChips() {
        const groups = {
          liste: chipsListes,
          decade: chipsDecades,
          genre: chipsGenres,
          geography: chipsGeography,
        };
        for (const container of Object.values(groups)) {
          container.innerHTML = "";

        const needle = categoryFilter.trim().toLowerCase();
        const visible = availableCategories.filter(
          (c) =>
            typeActive(c.mediaType) &&
            (!needle || c.label.toLowerCase().includes(needle)),
        );

        for (const cat of visible) {
          const container = groups[cat.group] || chipsListes;
          const chip = makeChip(
            `${cat.label}<span class="count">${cat.available}</span>`,
            selectedCategories.has(cat.key),
            async () => {

                selectedCategories.delete(cat.key);
              } else {
                selectedCategories.add(cat.key);
              }
              renderChips();
              await updatePoolSize();
              saveSettings();
            },
          );
          container.appendChild(chip);
        }

        // masque entièrement une section (label compris) dès qu'elle n'a
        // aucune puce à montrer — que ce soit parce que ce groupe n'existe
        // pas pour le(s) type(s) actif(s) (ex: "Géographie" pour les films)

            .length

      async function updatePoolSize() {
        const categories = [...selectedCategories].join(",");
        try {
          const res = await fetch(`/api/pool-size?categories=${categories}`);
          const data = await res.json();
          currentMaxAvailable = Math.max(5, data.available);
        } catch {
          currentMaxAvailable = 100;
        }
        const clampedMax = Math.min(100, currentMaxAvailable);
        countRange.max = clampedMax;
        countNumber.max = clampedMax;
        if (currentCount() > clampedMax) {
          countNumber.value = clampedMax;
          countRange.value = clampedMax;
        }
        if (clampedMax < 100) {
          countCapNote.textContent = `Limité à ${clampedMax} (pool des catégories choisies)`;
          countCapNote.style.display = "inline";
        } else {
          countCapNote.style.display = "none";
        }
